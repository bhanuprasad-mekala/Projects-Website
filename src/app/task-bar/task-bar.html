<div class="taskbar">
  <!-- Centered Content -->
  <div class="taskbar-content">
    <!-- Start Button -->
    <div class="start-section">
      <button class="btn btn-primary start-btn">
        <fa-icon [icon]="faWindows"></fa-icon>
      </button>
    </div>

    <!-- Search Bar -->
    <div class="search-section">
      <div class="input-group">
        <span class="input-group-text">
          <fa-icon [icon]="faSearch"></fa-icon>
        </span>
        <input type="text" class="form-control" placeholder="Type here to search">
      </div>
    </div>
  </div>

  <!-- System Tray (Right End) -->
  <div class="system-tray">
    <div class="system-info">
      <div class="battery" [title]="batteryLevel + '%'" [class.low-battery]="batteryLevel < 20 && !isCharging" [class.charging]="isCharging">
        <fa-icon [icon]="batteryIcon"></fa-icon>
        <span class="charging-indicator" *ngIf="isCharging">
          <fa-icon [icon]="faBolt"></fa-icon>
        </span>
      </div>
      <div class="time-date">
        <div class="time">{{ currentTime }}</div>
        <div class="date">{{ currentDate }}</div>
      </div>
    </div>
  </div>
</div>
